<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="시험장 입구에서 AI 부정행위자를 가려내는 판별 게임">
<meta name="theme-color" content="#fbf1ee">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>입실 마감 08:10</title>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","three/addons/":"./lib/addons/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 시험장 정문 검색대 — 왼쪽은 툰 렌더링 3D 검색대(줌인/줌아웃), 오른쪽은 수험표·명단·기록. OMR 답안지 붉은 괘선 + 사인펜 검정. 단일 테마. */
:root{
  --paper:#fbf1ee; --sheet:#fffdfc; --rule:#e8a49b; --red:#c8322a; --ink:#1d1e26;
  --muted:#6f6264; --ok:#2d7a4e; --scan:#1f63c6; --line:#ecd3cd; --warn:#b26a00; --radio:#7b3fd1;
  --f-display:"Black Han Sans","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;box-sizing:border-box}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--scan);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.hud{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;border-bottom:2px solid var(--red);padding-bottom:10px}
.brand{font-family:var(--f-display);font-size:26px;color:var(--red);letter-spacing:.5px;margin-right:auto;align-self:center;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:4px;font-weight:500}
.stat{background:var(--sheet);border:1px solid var(--line);padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:76px}
.stat b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.stat.clock b{font-family:var(--f-display);font-size:26px;font-weight:400;letter-spacing:1px}
.stat.clock.late b{color:var(--red)}

.main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

.stage{background:var(--sheet);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px dashed var(--rule);font-size:12px;color:var(--muted)}
.stage-top b{color:var(--ink);font-size:14px}
.view{position:relative;height:min(68vh,640px);min-height:340px;background:#e9efe9;overflow:hidden;touch-action:none;cursor:grab}
.view.dragging{cursor:grabbing}
.view.mode-look,.view.mode-pat{cursor:crosshair}
.view canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;pointer-events:none}
.badge{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:700;color:#fff;padding:2px 6px;white-space:nowrap;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.badge.metal{background:var(--scan)}.badge.radio{background:var(--radio)}.badge.pat{background:var(--red)}.badge.look{background:#6f6264}
.badges{display:flex;flex-direction:column;gap:3px;position:absolute;transform:translate(0,-50%)}
.badges .badge{position:static;transform:none}
.hover{position:absolute;font-size:12px;background:var(--ink);color:#fff;padding:3px 8px;transform:translate(12px,12px);white-space:nowrap}
.vctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.vctl button{background:var(--sheet);border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:6px 9px;font-size:12px;font-weight:700;min-width:44px}
.vctl button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.vback{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:#fff;border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:10px 22px;font-size:15px;font-weight:700;border-radius:999px}
.vback[hidden]{display:none}
.zoomtag{position:absolute;left:10px;top:10px;background:var(--ink);color:#fff;font-size:12px;padding:4px 9px;font-weight:700}
.helpline{position:absolute;left:10px;bottom:10px;right:70px;font-size:11.5px;color:#3f4a42;background:rgba(255,255,255,.75);padding:4px 8px;width:max-content;max-width:calc(100% - 80px)}

.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px;border-top:1px solid var(--line)}
@media (max-width:520px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tool{background:var(--paper);border:1.5px solid var(--line);padding:8px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tool b{font-size:13px;font-weight:700}
.tool span{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.tool:hover:not(:disabled){border-color:var(--ink)}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool.on span{color:#d9d3d4}
.tool:disabled{opacity:.38;cursor:not-allowed}
.tool .key{float:right;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 10px}
.verdict button{border:none;padding:14px 8px;font-size:16px;font-weight:700;color:#fff;letter-spacing:.02em}
.btn-pass{background:var(--ok)}.btn-catch{background:var(--red)}
.verdict button:disabled{opacity:.4;cursor:not-allowed}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--line);min-width:0}
.card h3{margin:0;font-size:12px;letter-spacing:.1em;color:var(--red);padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.card h3 em{font-style:normal;color:var(--muted);font-weight:500;letter-spacing:0}
.card .body{padding:10px 12px}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.docs{grid-template-columns:1fr}}
.doc{border:1.5px solid var(--rule);padding:8px;display:flex;gap:8px;min-width:0;background:#fff}
.doc.empty{border-style:dashed;color:var(--muted);font-size:12px;align-items:center;justify-content:center;min-height:120px;text-align:center}
.doc .photo{width:72px;flex:none;border:1px solid var(--line);background:#dfe8f1;aspect-ratio:4/5}
.doc .photo img{display:block;width:100%;height:100%;object-fit:cover}
.doc dl{margin:0;font-size:11.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-content:start;min-width:0}
.doc dt{color:var(--muted)}
.doc dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.doc .tag{grid-column:1/-1;font-size:10px;letter-spacing:.12em;color:var(--red);font-weight:700}
.doc .num{font-family:var(--f-mono)}
.note{grid-column:1/-1;margin-top:3px;padding:2px 5px;background:#fff3d6;color:var(--warn);font-weight:700}
.found{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.chip{font-size:12px;padding:4px 8px;border:1px solid var(--ink);background:#fff}
.chip.case{border-color:var(--muted)}
.empty-txt{color:var(--muted);font-size:12px}
.log{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto;font-size:12.5px}
.log li{padding:6px 12px;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:44px 1fr;gap:6px}
.log li time{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.log li b{font-weight:700}
.log li.k-detect b{color:var(--scan)}.log li.k-radio b{color:var(--radio)}
.log li.k-pat b,.log li.k-look b{color:var(--red)}
.rules{margin:0;padding:0 12px 10px 30px;font-size:12.5px;line-height:1.6}
.rules li.new{color:var(--red);font-weight:700}
.rules li.new::after{content:" 신규";font-size:10px;background:var(--red);color:#fff;padding:0 4px;margin-left:4px;vertical-align:1px}

.modal{position:fixed;inset:0;background:rgba(29,30,38,.62);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--sheet);max-width:640px;width:100%;max-height:100%;overflow:auto;border-top:8px solid var(--red);padding:22px 22px 18px 34px;
  background-image:linear-gradient(90deg,transparent 0 22px,var(--rule) 22px 23px,transparent 23px)}
.sheet h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.05;margin:0 0 4px;color:var(--red);text-wrap:balance}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 6px;text-wrap:balance}
.sheet p{line-height:1.65;margin:8px 0;max-width:62ch}
.sheet .eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.sheet .go:disabled{opacity:.55;cursor:progress}
.go-row{display:flex;flex-wrap:wrap;gap:8px}.sheet .go.alt{background:var(--sheet);color:var(--red);border:2px solid var(--red)}
.sheet .go{margin-top:14px;background:var(--ink);color:#fff;border:none;padding:12px 22px;font-size:15px;font-weight:700}
.score-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0}
.score-table td,.score-table th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.score-table th{font-size:11px;color:var(--muted);font-weight:500}
.score-table td.pts{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.good{color:var(--ok);font-weight:700}.bad{color:var(--red);font-weight:700}
.tbl-wrap{overflow-x:auto}
.pointgrid{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:13px;max-width:360px;margin:8px 0}
.pointgrid span:nth-child(2n){font-family:var(--f-mono);text-align:right}
.modal[hidden],.toast[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.sheet-head,.peek,.ticker,.tool.docs-btn{display:none}
@media (max-width:900px){
  html{height:100%;height:100dvh;overflow:hidden}
  body{height:100%;overflow:hidden;display:flex;flex-direction:column;padding-block:6px}
  .wrap{flex:1;min-height:0;width:100%;gap:6px}
  .hud{gap:5px;padding-bottom:6px;flex-wrap:nowrap;align-items:center}
  .brand{font-size:15px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:none}
  .stat{padding:2px 7px;min-width:0;flex:none}
  .stat span{font-size:9px;letter-spacing:0}.stat b{font-size:14px}.stat.clock b{font-size:17px}
  .main{flex:1;min-height:0;display:flex;flex-direction:column}
  .stage{flex:1;min-height:0}
  .stage-top{padding:4px 10px;font-size:11px}.stage-top b{font-size:13px}
  .view{flex:1;height:auto;min-height:0}
  .helpline{display:none}
  .tools{gap:4px;padding:6px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .tool{padding:5px 5px;gap:0}.tool b{font-size:11.5px;line-height:1.25;word-break:keep-all}.tool span{font-size:9.5px}.tool .key{display:none}
  .tool.docs-btn{display:flex;background:var(--sheet);border-color:var(--ink)}
  .verdict{padding:0 6px 6px;gap:6px}.verdict button{padding:11px 6px;font-size:15px}
  .vctl{top:6px;gap:4px}.vctl button{padding:4px 7px;min-width:36px;font-size:11px}
  .vback{bottom:38px;padding:8px 18px;font-size:14px}
  .zoomtag{top:6px;left:6px;font-size:11px}
  .peek{display:flex;position:absolute;left:6px;top:32px;gap:4px;cursor:pointer}
  .peek figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:1px}
  .peek img{width:42px;height:52px;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);background:#dfe8f1}
  .peek figcaption{font-size:9px;font-weight:700;color:#fff;background:rgba(29,30,38,.8);padding:0 4px}
  .ticker{display:block;position:absolute;left:6px;right:6px;bottom:6px;font-size:11.5px;line-height:1.4;background:rgba(29,30,38,.85);color:#fff;padding:5px 8px;pointer-events:none;max-height:3.2em;overflow:hidden}
  .ticker[hidden]{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;height:min(66%,560px);z-index:15;background:var(--paper);border-top:3px solid var(--red);
    padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    overflow:auto;gap:8px;box-shadow:0 -8px 24px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s;visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .sheet-head{display:flex;position:sticky;top:0;z-index:1;background:var(--paper);justify-content:space-between;align-items:center;padding:9px 0 6px;font-size:14px}
  .sheet-head button{background:var(--ink);color:#fff;border:none;padding:7px 14px;font-weight:700}
  .log{max-height:none}
  .toast{bottom:auto;top:calc(54px + env(safe-area-inset-top,0px))}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.side{transition:none}}
.err{padding:20px;color:var(--red);font-weight:700}
.share{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule);display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:480px){.share{grid-template-columns:96px minmax(0,1fr)}}
.share .thumb{border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--paper);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:zoom-in;overflow:hidden}
.share .thumb img{display:block;width:100%;height:100%;object-fit:cover}
.share .s-title{font-size:11px;letter-spacing:.12em;color:var(--red);font-weight:700;margin-bottom:6px}
.share .s-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.share .s-btns button{background:var(--sheet);border:1.5px solid var(--ink);padding:8px 6px;font-size:12.5px;font-weight:700;min-height:38px}
.share .s-btns button.prime{background:var(--red);border-color:var(--red);color:#fff;grid-column:1/-1}
.share .s-btns button:disabled{opacity:.45;cursor:progress}
.share .s-btns button:active{transform:translate(1px,1px)}
</style>

</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="brand">입실 마감 08:10<small>시험장 부정행위 검문</small></div>
    <div class="stat"><span>근무일</span><b id="hDay">1 / 5</b></div>
    <div class="stat clock" id="hClockBox"><span>현재 시각</span><b id="hClock">07:30</b></div>
    <div class="stat"><span>대기 인원</span><b id="hQueue">0</b></div>
    <div class="stat"><span>점수</span><b id="hScore">0</b></div>
  </header>

  <div class="main">
    <section class="stage" aria-label="응시자 검색대">
      <div class="stage-top"><span>검색대 · <b id="who">—</b></span><span id="modeTxt">도구를 고르세요</span></div>
      <div class="view" id="view">
        <div class="overlay" id="overlay"></div>
        <div class="peek" id="peek" title="서류 보기"></div>
        <div class="ticker" id="ticker" hidden></div>
        <div class="zoomtag" id="zoomtag" hidden></div>
        <div class="vctl">
          <button id="vOut" title="전체 보기 (Esc)">전체</button>
          <button id="vIn" title="확대">＋</button>
          <button id="vZo" title="축소">－</button>
          <button id="vL" title="왼쪽으로 돌리기">↺</button>
          <button id="vR" title="오른쪽으로 돌리기">↻</button>
        </div>
        <div class="helpline" id="helpline">부위를 누르면 확대 · 드래그하면 회전 · 휠/핀치로 줌</div>
        <button class="vback" id="vBack" hidden>← 전체 보기</button>
      </div>
      <div class="tools" id="tools"></div>
      <div class="verdict">
        <button class="btn-pass" id="bPass">입실 허가</button>
        <button class="btn-catch" id="bCatch">부정행위 적발</button>
      </div>
    </section>

    <aside class="side" id="side">
      <div class="sheet-head"><b>서류 · 조사 기록</b><button id="bSheetClose">닫기</button></div>
      <div class="card"><h3>신원 확인 <em>수험표 · 응시자 명단</em></h3><div class="body docs" id="docs"></div></div>
      <div class="card"><h3>발견 물품 <em id="foundCount"></em></h3><div class="body"><div class="found" id="found"></div></div></div>
      <div class="card"><h3>조사 기록</h3><ul class="log" id="log"></ul></div>
      <div class="card"><h3>오늘의 반입 규정</h3><ol class="rules" id="rules"></ol></div>
    </aside>
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"><div class="eyebrow">불러오는 중</div><h2>검색대를 준비하고 있습니다</h2></div></div>

<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// ═════════ 게임 데이터 ═════════
const ZONES={
  head:{name:'머리·귀',    c:[0,1.6,-.01], s:[.3,.32,.3],  off:[.28,.05,.6],  b:[.22,.08,0]},
  eyes:{name:'얼굴·안경',  c:[0,1.55,.1],  s:[.2,.13,.07], off:[.05,.01,.42], b:[.22,0,0]},
  chest:{name:'상의',      c:[0,1.17,0],   s:[.42,.42,.25],off:[.2,.1,.9],    b:[.27,.1,0]},
  lhand:{name:'왼손목·손', c:[.21,.78,.01],s:[.12,.3,.14], off:[.38,.1,.45],  b:[.13,.02,0]},
  rhand:{name:'오른손목·손',c:[-.21,.78,.01],s:[.12,.3,.14],off:[-.38,.1,.45],b:[-.13,.02,0]},
  pants:{name:'하의·주머니',c:[0,.82,0],   s:[.28,.34,.27],off:[.18,.1,.85],  b:[.2,-.12,0]},
  shoes:{name:'신발',      c:[0,.07,.04],  s:[.32,.16,.34],off:[.22,.36,.75], b:[.22,.02,0]},
};
const WRIST=['lhand','rhand'];
const ITEMS={
  phone:{name:'스마트폰',zones:['pants','chest'],metal:3,radio:true,look:'주머니 위로 휴대폰 윗부분이 삐져나와 있다.',ban:()=>true,from:1,w:3,why:'휴대폰 소지'},

let person=null, outgoing=null;
const cam={zone:null,zoom:1,yaw:0,yawT:0,pos:new THREE.Vector3(.6,1.3,4),tgt:new THREE.Vector3(.2,.95,0),custom:null};
function overviewPose(){
  const aspect=camera.aspect, t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const narrow=aspect<.8, d=Math.max(4.25,(narrow?.85:1.1)/(aspect*t));
  return{pos:new THREE.Vector3(narrow?.3:.45,1.26,d),tgt:new THREE.Vector3(narrow?.1:.18,.98,0)};
}
function zoneWorld(local){return person.localToWorld(new THREE.Vector3(...local))}
const zc=z=>person.userData.refs.zc[z];
function desiredPose(){
  let pos,tgt;
  if(cam.custom){pos=cam.custom.pos.clone();tgt=cam.custom.tgt.clone()}
  else if(cam.zone&&person){const z=ZONES[cam.zone];tgt=zoneWorld(zc(cam.zone));pos=tgt.clone().add(new THREE.Vector3(...z.off))}
  else ({pos,tgt}=overviewPose());
  pos.sub(tgt).multiplyScalar(cam.zoom).add(tgt);
  return{pos,tgt};
}
function setZone(z){cam.custom=null;cam.zone=z;cam.zoom=1;
  const t=$('#zoomtag');t.hidden=!z;if(z)t.textContent=`확대: ${ZONES[z].name}`;zoomUi();
  if(person){const H=person.userData.refs.hands;for(const k in H)H[k].turn=k===z?1:0}
}
function setDesk(){cam.zone=null;cam.zoom=1;cam.custom={pos:new THREE.Vector3(1.02,1.32,.72),tgt:new THREE.Vector3(.9,.78,.07)};const t=$('#zoomtag');t.hidden=false;t.textContent='확대: 필통';zoomUi()}
function zoomUi(){const zin=!!(cam.zone||cam.custom);$('#vBack').hidden=!zin;$('#helpline').textContent=zin?'빈 곳 클릭 · 우클릭 · Space · 휠 축소로 전체 보기':'부위를 누르면 확대 · 드래그하면 회전 · 휠/핀치로 줌'}
function overviewView(){setZone(null);}

// 입력: 드래그=회전, 휠/핀치=줌, 탭=부위 선택
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const ptrs=new Map();let dragMoved=false,pinch0=0,zoom0=1,hoverZ=null;
function pickZone(e){if(!person)return null;const r=renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects(person.userData.refs.zoneMeshes,false);return h.length?h[0].object.userData.zone:null}
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});dragMoved=false;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=cam.zoom}});
el.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);
  if(!p){setHover(pickZone(e),e);return}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)cam.zoom=THREE.MathUtils.clamp(zoom0*pinch0/d,.35,1.7);dragMoved=true;if((cam.zone||cam.custom)&&cam.zoom>=1.6)overviewView();return}
  if(Math.hypot(p.x-p.x0,p.y-p.y0)>6){dragMoved=true;view.classList.add('dragging')}
  if(dragMoved){cam.yawT+=e.movementX*.012;}
});
const endPtr=e=>{const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);view.classList.remove('dragging');
  if(p&&!dragMoved&&ptrs.size===0&&e.type==='pointerup'&&e.button===0){const z=pickZone(e);
    if(!z||(z===cam.zone&&!S.mode)){if(cam.zone||cam.custom)overviewView()}else zoneClick(z)}
  if(ptrs.size<2)pinch0=0};
el.addEventListener('pointerup',endPtr);el.addEventListener('pointercancel',endPtr);
el.addEventListener('pointerleave',()=>setHover(null));
el.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=THREE.MathUtils.clamp(cam.zoom*Math.exp(e.deltaY*.0012),.35,1.7);
  if((cam.zone||cam.custom)&&cam.zoom>=1.6&&e.deltaY>0)overviewView()},{passive:false});
el.addEventListener('contextmenu',e=>{e.preventDefault();overviewView()});
const hoverEl=document.createElement('div');hoverEl.className='hover';hoverEl.hidden=true;overlay.appendChild(hoverEl);
function setHover(z,e){
  if(hoverZ!==z&&person){for(const m of person.userData.refs.zoneMeshes)m.material.visible=m.userData.zone===z&&!!S.mode;hoverZ=z}
  if(!z||!e){hoverEl.hidden=true;return}
  const r=view.getBoundingClientRect();hoverEl.hidden=false;hoverEl.style.left=(e.clientX-r.left)+'px';hoverEl.style.top=(e.clientY-r.top)+'px';
  hoverEl.textContent=S.mode?`${TOOLS[S.mode].name} → ${ZONES[z].name}`:`${ZONES[z].name} 확대`;
}
$('#vOut').onclick=overviewView;$('#vBack').onclick=overviewView;
$('#vIn').onclick=()=>cam.zoom=Math.max(.35,cam.zoom*.75);
$('#vZo').onclick=()=>cam.zoom=Math.min(1.7,cam.zoom/.75);

// 오버레이 배지 (탐지 결과)
const badgeEls={};
function updateBadges(){
  if(!person||!S.cur){for(const k in badgeEls)badgeEls[k].hidden=true;return}
  const ins=S.cur.ins, r=view.getBoundingClientRect();
  for(const z in ZONES){
    let b=badgeEls[z];if(!b){b=badgeEls[z]=document.createElement('div');b.className='badges';overlay.appendChild(b)}
    const parts=[];
    if(ins.detectVal&&ins.detectVal[z])parts.push(`<span class="badge metal">금속 ${'▮'.repeat(ins.detectVal[z])}</span>`);
    if(ins.radioVal&&ins.radioVal[z])parts.push('<span class="badge radio">전파</span>');
    if(ins.pat[z])parts.push('<span class="badge pat">수색</span>');else if(ins.look[z])parts.push('<span class="badge look">육안</span>');
    const html=parts.join('');if(b._h!==html){b.innerHTML=html;b._h=html}
    if(!parts.length||cam.zone){b.hidden=true;continue}
    const c=zc(z),bo=ZONES[z].b;const v=zoneWorld([c[0]+bo[0],c[1]+bo[1],c[2]+bo[2]]).project(camera);
    b.hidden=v.z>1;b.style.left=((v.x+1)/2*r.width)+'px';b.style.top=((1-v.y)/2*r.height)+'px';
  }
}

// 애니메이션 루프
const tweens=[];
function tween(dur,fn,done){tweens.push({t0:performance.now(),dur,fn,done})}
let last=performance.now();
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();RES.value.set(w*renderer.getPixelRatio(),h*renderer.getPixelRatio())}
new ResizeObserver(resize).observe(view);resize();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];const k=Math.min(1,(now-t.t0)/t.dur);t.fn(k);if(k>=1){tweens.splice(i,1);t.done&&t.done()}}
  cam.yaw+=(cam.yawT-cam.yaw)*(1-Math.exp(-dt*8));
  if(person){person.rotation.y=cam.yaw;
    if(person.userData.tick)person.userData.tick(dt,now);
    else{const rf=person.userData.refs,tt=now/1000;
      rf.head.rotation.z=Math.sin(tt*.9)*.03;rf.head.rotation.y=Math.sin(tt*.47)*.06;rf.body.position.y=Math.sin(tt*1.7)*.0025;
      if(rf.looks)for(const L of rf.looks){L.g.rotation.x=L.rx+Math.sin(tt*5.3+L.ph)*.07;L.g.rotation.y=L.ry+Math.sin(tt*4.1+L.ph*1.7)*.09}
      const H=rf.hands;for(const k in H){const h=H[k];h.hand.rotation.y+=(h.turn*h.s*Math.PI/2-h.hand.rotation.y)*(1-Math.exp(-dt*7))}}}
  if(outgoing&&outgoing.userData.tick)outgoing.userData.tick(dt,now);
  person&&person.updateMatrixWorld(true);
  const d=desiredPose(), a=1-Math.exp(-dt*5);
  cam.pos.lerp(d.pos,a);cam.tgt.lerp(d.tgt,a);camera.position.copy(cam.pos);camera.lookAt(cam.tgt);
  renderer.render(scene,camera);updateBadges();
  requestAnimationFrame(frame);
}

// ═════════ 게임 진행 ═════════
const S={day:1,t:0,score:0,queue:[],cur:null,idx:0,mode:null,results:[],all:[],busy:false,ended:false};
let ac=null;
function beep(freq,dur=.12,type='square',vol=.05){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);
    g.gain.setTargetAtTime(0,ac.currentTime+dur*.6,dur*.25);o.start();o.stop(ac.currentTime+dur+.05)}catch(e){}
}
function startDay(){S.t=0;S.queue=[];S.results=[];S.idx=0;S.ended=false;drawClock(0);
  for(let i=0;i<DAYS[S.day-1].n;i++)S.queue.push(makePerson(S.day));renderRules();nextPerson()}
function walkOut(){
  if(!person)return;const o=person;person=null;outgoing=o;
  o.rotation.y=-Math.PI/2;const x0=o.position.x;
  tween(700,k=>{o.position.x=x0-k*3.2;o.position.y=Math.abs(Math.sin(k*12))*.015},()=>{if(person!==o){scene.remove(o);disposeTree(o)}if(outgoing===o)outgoing=null});
}
function nextPerson(){
  walkOut();
  S.cur=S.queue.shift()||null;S.mode=null;
  if(!S.cur){endDay();return}
  S.idx++;sheet(false);
  const p=S.cur;
  p.ins={look:{},pat:{},detect:false,radio:false,case:false,roster:false,ask:false,log:[],found:[]};
  p.cardImg=portrait(p.cardApp,p.cardGlasses);p.rosterImg=null;
  person=buildPerson(p.app,p.items);
  scene.add(person);
  overviewView();cam.yaw=cam.yawT=-Math.PI/2;
  person.position.x=3;S.busy=true;
  lid.rotation.x=0;clearCase();
  tween(900,k=>{const e=1-Math.pow(1-k,3);person.position.x=3*(1-e);person.position.y=Math.abs(Math.sin(k*14))*.015*(1-k)},()=>{S.busy=false;cam.yawT=0;renderTools()});
  renderAll();
  log('입장',`${p.name} 응시자가 검색대에 섰다.`,'in');
}
function spend(m){S.t+=m;drawClock(Math.min(LIMIT,S.t));renderHud();if(S.t>=LIMIT){setTimeout(timeUp,350);return false}return true}
function timeUp(){
  if(S.ended)return;S.ended=true;
  toast('08:10 입실 마감. 남은 응시자는 처리하지 못했습니다.');
  const left=[...(S.cur?[S.cur]:[]),...S.queue];
  left.forEach(p=>S.results.push({p,verdict:null,pts:PTS.left,day:S.day}));
  S.score+=PTS.left*left.length;S.queue=[];S.cur=null;endDay();
}
function log(kind,text,cls){S.cur.ins.log.push({t:clock(S.t),kind,text,cls});renderLog();
  const tk=$('#ticker');tk.textContent=`${kind} · ${text}`;tk.hidden=false;const d=$('#bDocs');if(d)d.lastElementChild.textContent=S.cur.ins.log.length+'건'}
function sheet(open){$('#side').classList.toggle('open',open)}
function addFound(name,src){if(!S.cur.ins.found.some(f=>f.name===name))S.cur.ins.found.push({name,src});renderFound()}

function useTool(k){
  if(S.busy||!S.cur)return;
  const T=TOOLS[k];if(T.from&&S.day<T.from)return;
  if(T.per){S.mode=S.mode===k?null:k;renderTools();return}
  S.mode=null;
  if(S.cur.ins[k]){toast('이미 확인했습니다. 조사 기록을 보세요.');renderTools();return}
  S.cur.ins[k]=true;
  if(k==='detect'||k==='radio')return sweep(k);
  if(!spend(T.cost))return;
  const p=S.cur;
  if(k==='case'){
    setDesk();tween(500,kk=>lid.rotation.x=-kk*1.9);layCase(p);
    const list=[...p.caseList];
    p.caseItems.forEach(id=>{if(id==='eraserNote'){const i=list.indexOf('지우개');list[i]='지우개 (케이스 안에 접힌 종이가 끼워져 있다)'}else list.push(ITEMS[id].name)});
    log('필통',list.join(', '),'k-look');p.caseItems.forEach(id=>addFound(ITEMS[id].name,'필통'));beep(520,.08,'triangle');
  }
  if(k==='roster'){p.rosterImg=portrait(p.rosterApp,p.rosterGlasses);log('명단 조회',`수험번호 ${p.num} 조회 완료. 명단 사진을 대조하세요.`,'k-look');renderDocs()}
  if(k==='ask'){
    const [y,m,d]=p.claimBirth.split('.');const ans=`"${y}년 ${+m}월 ${+d}일이요."`;
    let cue='';
    if(has(p,'earbud')&&chance(.75))cue=' (대답 전에 잠깐 멈칫하며 귀 쪽으로 고개를 기울인다)';
    else if(has(p,'hearing'))cue=' ("네? 다시 한 번만 말씀해 주시겠어요?" 하고 되묻는다)';
    else if(p.impostor&&chance(.5))cue=' (수험표를 힐끗 내려다본다)';
    else if(p.nervous)cue=' (손을 심하게 떨고 있다)';
    log('질문',`"생년월일이요?" → ${ans}${cue}`,'k-look');
    setZone('eyes');
  }
  renderTools();renderHud();
}
function zoneClick(z){
  if(S.busy||!S.cur)return;
  setZone(z);
  if(!S.mode)return;
  const k=S.mode,p=S.cur,done=p.ins[k];
  if(done[z]){toast(`${ZONES[z].name}: 이미 확인했습니다.`);return}
  if(!spend(TOOLS[k].cost))return;
  done[z]=true;
  const its=p.items[z];
  if(k==='look'){
    const seen=its.map(id=>ITEMS[id].look).filter(Boolean);
    log(`육안·${ZONES[z].name}`,seen.length?seen.join(' '):(WRIST.includes(z)?'손등과 손바닥 모두 깨끗하다.':'눈에 띄는 것이 없다.'),'k-look');
    beep(700,.05,'sine',.03);
  } else {
    const names=its.map(id=>ITEMS[id].name);
    log(`정밀수색·${ZONES[z].name}`,names.length?names.join(', ')+' 발견.':'아무것도 나오지 않았다.','k-pat');
    its.forEach(id=>addFound(ITEMS[id].name,ZONES[z].name));
    beep(names.length?440:300,.08,'triangle');
    if(names.length)toast(`${ZONES[z].name}에서 ${names.join(', ')} 발견`);
  }
  renderTools();
}
function sweep(kind){
  if(!spend(TOOLS[kind].cost))return;
  S.busy=true;overviewView();cam.yawT=Math.round(cam.yawT/(Math.PI*2))*Math.PI*2;renderTools();
  const order=['head','eyes','chest','lhand','rhand','pants','shoes'];
  const p=S.cur,val={};
  order.forEach(z=>{val[z]=kind==='detect'?Math.min(3,p.items[z].reduce((s,id)=>s+ITEMS[id].metal,0)):p.items[z].some(id=>ITEMS[id].radio)?1:0});
  // 동작 줄이기 설정에서도 탐지 과정은 보여 준다. 좌우 흔들림만 뺀다.
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T=TOOLS[kind],col=kind==='detect'?'#1f63c6':'#7b3fd1',hitCol=kind==='detect'?'#ff3b30':'#b46bff';
  const fired={};const ledOff=new THREE.Color('#333'), ledOn=new THREE.Color(hitCol);
  const live=p.ins[kind+'Val']={};
  scanLine.material.color.set(col);scanDisc.material.color.set(col);
  wand.visible=scanRing.visible=true;
  const status=z=>{const hits=order.filter(q=>fired[q]&&val[q]);
    $('#modeTxt').textContent=`${T.name} 스캔 중 · ${z?ZONES[z].name:'머리'}${hits.length?` · 반응 ${hits.length}곳`:''}`};
  status(null);
  tween(3200,k=>{
    const y=1.84-k*1.8, x=reduce?0:Math.sin(k*Math.PI*9)*.13;
    const wp=person.localToWorld(new THREE.Vector3(x,y,.36));wand.position.copy(wp);wand.rotation.set(0,cam.yaw,0);
    scanRing.position.copy(person.localToWorld(new THREE.Vector3(0,y,0)));
    let lit=false,cur=null;
    order.forEach(z=>{const c=zc(z),s=ZONES[z].s;const zy=c[1];
      if(Math.abs(y-zy)<s[1]/2){cur=cur||z;if(val[z])lit=true}
      if(!fired[z]&&y<=zy){fired[z]=1;live[z]=val[z];status(z);
        if(val[z]){if(kind==='detect')beep(300+val[z]*260,.12+val[z]*.05,'square',.04+val[z]*.015);else beep(1200,.07,'sine',.04)}}});
    wandLed.material.color.copy(lit?ledOn:ledOff);
    scanLine.material.color.set(lit?hitCol:col);scanDisc.material.color.set(lit?hitCol:col);
    scanDisc.material.opacity=lit?.28:.12;
    const pulse=lit&&!reduce?1+.06*Math.sin(performance.now()/40):1;scanRing.scale.setScalar(pulse);
  },()=>{
    wand.visible=scanRing.visible=false;S.busy=false;p.ins[kind+'Val']=val;
    const hits=order.filter(z=>val[z]);
    if(kind==='detect')log('금속탐지',hits.length?hits.map(z=>`${ZONES[z].name} ${'▮'.repeat(val[z])}${'▯'.repeat(3-val[z])}`).join(' · '):'전신에서 반응 없음.','k-detect');
    else log('전파탐지',hits.length?hits.map(z=>ZONES[z].name).join(', ')+'에서 무선 신호 감지.':'무선 신호 없음.','k-radio');
    renderTools();
  });
}
function decide(catchIt){
  if(!S.cur||S.busy)return;
  const p=S.cur;const pts=catchIt?(p.cheat?PTS.catch:PTS.wrongCatch):(p.cheat?PTS.miss:PTS.pass);
  S.score+=pts;S.results.push({p,verdict:catchIt?'catch':'pass',pts,day:S.day});
  beep(catchIt?220:660,.15,'sawtooth',.03);
  toast(catchIt?`${p.name} 응시자를 퇴실 조치했습니다.`:`${p.name} 응시자를 입실시켰습니다.`);
  S.cur=null;
  const go=()=>{if(!spend(.5)){renderTools();return}nextPerson()};
  if(!catchIt&&p.cheat){const miss=tally([...S.all,...S.results]).miss;if(miss&&miss%MISS_LIMIT===0){missReport(miss,go);return}}
  go();
}
// 부정행위자를 MISS_LIMIT명 놓칠 때마다 시험실에서 적발 보고가 올라오고, 계속 근무할지 고른다.
const MISS_LIMIT=3;
function missReport(miss,cont){
  walkOut();overviewView();renderAll();
  const list=[...S.all,...S.results],st=tally(list),rk=rankOf(st,S.day);
  const missed=list.filter(r=>r.verdict==='pass'&&r.p.cheat).slice(-MISS_LIMIT);
  const rows=missed.map(r=>`<tr><td>${esc(r.p.name)}</td><td>${r.day}일차</td><td><span class="bad">${esc(r.p.reasons.join(', '))}</span></td></tr>`).join('');
  beep(180,.35,'sawtooth',.05);
  modal(`<div class="eyebrow">근무 ${S.day}일차 ${clock(S.t)} · 시험실 감독관 보고</div><h2>통과시킨 부정행위자가 ${miss}명이 됐습니다</h2>
  <p>당신이 입실시킨 응시자가 시험 도중 시험실에서 적발됐습니다. 시험 주관 기관이 이 검색대를 지켜보고 있습니다.</p>

// ═════════ 결과 공유: 카드 이미지 · SNS ═════════
function tally(list){
  const c=k=>list.filter(k).length;
  const caught=c(r=>r.verdict==='catch'&&r.p.cheat), wrong=c(r=>r.verdict==='catch'&&!r.p.cheat),
    miss=c(r=>r.verdict==='pass'&&r.p.cheat), ok=c(r=>r.verdict==='pass'&&!r.p.cheat), left=c(r=>!r.verdict);
  return{caught,wrong,miss,ok,left,total:list.length,acc:Math.round((caught+ok)/Math.max(1,list.length)*100)};
}
// days: 지금까지 근무한 일수. 중간 평가는 기준을 근무 일수에 비례해 낮춘다.
function rankOf({acc,wrong,miss,left},days=5){
  const f=days/5,lim=n=>Math.max(2,Math.ceil(n*f));
  if(acc>=88&&wrong<=1)return{title:'명감독관',txt:'부정행위자는 빠짐없이 걸렀고 억울한 수험생은 거의 없었습니다. 내년에도 이 시험장을 맡아 달라는 요청이 왔습니다.'};
  if(wrong>=lim(4))return{title:'공포의 감독관',txt:'잡아낸 사람도 많았지만 죄 없는 수험생까지 퇴실시켰습니다. 시험 주관 기관 민원 게시판이 당신 이야기로 가득합니다.'};
  if(miss>=lim(4))return{title:'구멍 난 검색대',txt:'시험이 끝난 뒤 이어폰과 카메라 안경이 무더기로 적발됐습니다. 이 시험장 성적은 재검토 대상이 됐습니다.'};
  if(left>=lim(5))return{title:'느림보 감독관',txt:'꼼꼼했지만 너무 느렸습니다. 마감 시간을 넘겨 들어가지 못한 수험생들이 항의하고 있습니다.'};
  return{title:'평범한 감독관',txt:'큰 사고 없이 시험이 끝났습니다. 다만 놓친 사람과 억울한 사람이 몇 명 있었습니다.'};
}

  const all=[...S.all,...(d.extra||[])],days=[1,2,3,4,5].map(n=>all.filter(r=>r.day===n));
  const rowH=66,cx0=L+150,step=86,rad=25;
  days.forEach((list,i)=>{const y=gy+58+i*rowH,played=i+1<=d.day;
    g.strokeStyle=C.line;g.lineWidth=1.5;g.beginPath();g.moveTo(L,y+rowH/2);g.lineTo(R,y+rowH/2);g.stroke();
    txt(`${i+1}일차`,L,y+11,`600 30px ${FM}`,played?C.ink:'#c9b8b4');
    const n=DAYS[i].n;
    for(let j=0;j<n;j++){const x=cx0+j*step,r=list[j],o=r?outcome(r):null;
      g.beginPath();g.ellipse(x,y,rad,rad*.82,0,0,7);
      if(o==='hit'){g.fillStyle=C.red;g.fill()}
      else if(o==='ok'){g.fillStyle=C.ok;g.fill()}
      else if(o==='wrong'||o==='miss'){g.fillStyle='#fff';g.fill();g.strokeStyle=C.ink;g.lineWidth=3;g.stroke();
        g.beginPath();g.moveTo(x-13,y-13);g.lineTo(x+13,y+13);g.moveTo(x+13,y-13);g.lineTo(x-13,y+13);g.strokeStyle=C.red;g.lineWidth=6;g.stroke()}
      else if(o==='left'){g.setLineDash([6,6]);g.strokeStyle=C.muted;g.lineWidth=3;g.stroke();g.setLineDash([])}
      else{g.strokeStyle=played?C.rule:'#efdcd7';g.lineWidth=2.5;g.stroke();txt(String(j+1),x,y+8,`500 20px ${FM}`,played?C.rule:'#e8d3ce','center')}
    }});
  // 범례
  let lx=L;const ly=gy+58+5*rowH-12;
  [['hit','적발'],['ok','정상 입실'],['x','오판·놓침'],['left','미처리']].forEach(([k,t])=>{
    const x=lx+14,y=ly;g.beginPath();g.ellipse(x,y,14,11.5,0,0,7);
    if(k==='hit'){g.fillStyle=C.red;g.fill()}else if(k==='ok'){g.fillStyle=C.ok;g.fill()}
    else if(k==='x'){g.strokeStyle=C.ink;g.lineWidth=2;g.stroke();g.beginPath();g.moveTo(x-7,y-7);g.lineTo(x+7,y+7);g.moveTo(x+7,y-7);g.lineTo(x-7,y+7);g.strokeStyle=C.red;g.lineWidth=3.5;g.stroke()}
    else{g.setLineDash([4,4]);g.strokeStyle=C.muted;g.lineWidth=2;g.stroke();g.setLineDash([])}
    txt(t,x+24,y+9,`500 24px ${FB}`,C.muted);g.font=`500 24px ${FB}`;lx=x+24+g.measureText(t).width+34});
  // 집계
  const sy=1160,cells=[['적발',d.st.caught,C.red],['정상 입실',d.st.ok,C.ok],['무고 퇴실',d.st.wrong,C.ink],['놓침',d.st.miss,C.ink],['미처리',d.st.left,C.muted]];
  const cw=(R-L)/cells.length;
  g.fillStyle=C.paper;g.fillRect(L,sy-40,R-L,84);
  cells.forEach(([t,v,col],i)=>{const x=L+cw*i+cw/2;
    if(i){g.fillStyle=C.line;g.fillRect(L+cw*i,sy-28,2,60)}
    txt(t,x,sy-8,`700 22px ${FB}`,C.muted,'center');txt(`${v}명`,x,sy+32,`600 36px ${FM}`,col,'center')});
  // 하단
  g.fillStyle=C.ink;g.fillRect(40,H-128,W-80,88);
  txt('검색대에서 AI 부정행위자를 가려내 보세요',L,H-86,`700 30px ${FB}`,'#fff','left',R-L);
  txt(host,L,H-54,`600 24px ${FM}`,'#f3b7ae','left',R-L);
  return cv;
}
